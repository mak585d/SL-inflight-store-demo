/* ---- Uplift cart QR scan (camera + jsQR) ---- */
let _scanStream = null, _scanRAF = null;
function openUpliftScan(){ state.flightScanOpen = true; render(); }
function closeUpliftScan(){ stopCameraScan(); state.flightScanOpen = false; render(); }
async function startCameraScan(){
  if(_scanStream) return; // already running
  if(typeof jsQR === 'undefined'){
    showToast('QR scanner failed to load — check your connection, or enter the Uplift Number manually');
    state.flightScanOpen = false; render(); return;
  }
  try{
    _scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
  }catch(err){
    showToast('Camera unavailable — enter the Uplift Number manually');
    state.flightScanOpen = false; render(); return;
  }
  const video = document.getElementById('upliftScanVideo');
  if(!video){ stopCameraScan(); return; }
  video.srcObject = _scanStream;
  try{ await video.play(); }catch(e){}
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently:true });
  const tick = ()=>{
    if(!state.flightScanOpen || !_scanStream) return;
    if(video.readyState === video.HAVE_ENOUGH_DATA && video.videoWidth>0){
      canvas.width = video.videoWidth; canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const imageData = ctx.getImageData(0,0,canvas.width,canvas.height);
      const code = jsQR(imageData.data, imageData.width, imageData.height);
      if(code && code.data){ handleUpliftScanResult(code.data); return; }
    }
    _scanRAF = requestAnimationFrame(tick);
  };
  _scanRAF = requestAnimationFrame(tick);
}
function stopCameraScan(){
  if(_scanRAF) cancelAnimationFrame(_scanRAF);
  _scanRAF = null;
  if(_scanStream){ _scanStream.getTracks().forEach(t=>t.stop()); _scanStream=null; }
}
function handleUpliftScanResult(text){
  stopCameraScan();
  state.flightSetup.upliftNumber = String(text).trim();
  state.flightScanOpen = false;
  render();
  showToast('Uplift Number captured: ' + state.flightSetup.upliftNumber);
}

function getSeatData(seatCode){
  const map = state.seatMap[state.activeAircraft] || {};
  return map[seatCode] || null;
}
function openSeatMap(){ state.screen='seatMap'; state.seatSelection=[]; state.seatMapPanelOpen=false; render(); }
function closeSeatMap(){ state.screen='catalog'; render(); }
function setAircraft(code){ state.activeAircraft=code; state.seatSelection=[]; state.seatMapPanelOpen=false; render(); }
function openMealPanel(){ if(state.seatSelection.length===0) return; state.seatMapPanelOpen=true; render(); }
function assignMeal(mealId){
  if(!state.seatMap[state.activeAircraft]) state.seatMap[state.activeAircraft]={};
  const map = state.seatMap[state.activeAircraft];
  state.seatSelection.forEach(seat=>{
    const existing = map[seat] || {};
    map[seat] = { meal: mealId, perk: existing.perk||null, remark: existing.remark||'' };
  });
  render();
}
function assignPerk(perkId){
  if(!state.seatMap[state.activeAircraft]) state.seatMap[state.activeAircraft]={};
  const map = state.seatMap[state.activeAircraft];
  state.seatSelection.forEach(seat=>{
    const existing = map[seat] || {};
    const newPerk = existing.perk===perkId ? null : perkId; // tap again to unset
    map[seat] = { meal: existing.meal||null, perk: newPerk, remark: existing.remark||'' };
  });
  render();
}
function clearMeal(){
  const map = state.seatMap[state.activeAircraft];
  if(!map) return;
  state.seatSelection.forEach(seat=> delete map[seat]);
  render();
}
function setSeatRemark(v){
  if(state.seatSelection.length!==1) return;
  if(!state.seatMap[state.activeAircraft]) state.seatMap[state.activeAircraft]={};
  const map = state.seatMap[state.activeAircraft];
  const seat = state.seatSelection[0];
  const existing = map[seat] || {meal:null,perk:null};
  map[seat] = { meal: existing.meal, perk: existing.perk, remark: v };
}
function doneSeatSelection(){ state.seatMapPanelOpen=false; state.seatSelection=[]; render(); }
function clearSeatSelection(){ state.seatSelection=[]; render(); }

function seatCellHTML(row, col){
  const seatCode = row+col;
  const data = getSeatData(seatCode);
  const meal = data && MEAL_OPTIONS.find(m=>m.id===data.meal);
  const perk = data && PERK_OPTIONS.find(p=>p.id===data.perk);
  const selected = state.seatSelection.includes(seatCode);
  const style = (meal ? `background:${meal.color};` : '') + (perk ? `border-color:${perk.color};box-shadow:inset 0 0 0 1px ${perk.color};` : '');
  return `<button class="seat-btn ${selected?'selected':''}" data-seat="${seatCode}" style="${style}">
    ${col}
    ${meal ? `<span class="seat-meal-tag">${meal.abbr}</span>` : ''}
    ${perk ? `<span class="seat-perk-tag" style="background:${perk.color}">${perk.id.toUpperCase()}</span>` : ''}
    ${data && data.remark ? '<span class="seat-remark-dot"></span>' : ''}
  </button>`;
}

function seatMapPage(){
  const ac = AIRCRAFT_TYPES[state.activeAircraft];
  const rows = [];
  for(let r=1;r<=ac.rows;r++){
    if(ac.skipRows && ac.skipRows.includes(r)) continue;
    rows.push(r);
  }
  const ROW_H = 39, TOP_PAD = 70, BOTTOM_PAD = 40;
  const totalH = TOP_PAD + rows.length*ROW_H + BOTTOM_PAD;
  const wingLabels = ac.wingRows || [];
  const wingIdx = wingLabels.map(wr=>rows.indexOf(wr)).filter(i=>i>=0);
  const wingCenterIdx = wingIdx.length ? (wingIdx[0]+wingIdx[wingIdx.length-1])/2 : rows.length/2;
  const wingCenterPx = TOP_PAD + (wingCenterIdx+0.5)*ROW_H;
  const wingY = Math.round((wingCenterPx/totalH)*1600);
  const tailY = Math.round(0.92*1600);
  return `
  <div class="topbar">
    <div class="brand">
      <button class="pill-btn" id="seatMapBack">← Back</button>
    </div>
    <div class="topbar-right">
      <select class="currency-select" id="aircraftSelect">
        ${Object.values(AIRCRAFT_TYPES).map(a=>`<option value="${a.code}" ${state.activeAircraft===a.code?'selected':''}>${a.name}</option>`).join('')}
      </select>
    </div>
  </div>
  <div class="seatmap-scroll">
    <div class="seatmap-page">
      <div class="seatmap-legend">
        ${MEAL_OPTIONS.map(m=>`<div class="legend-item"><span class="legend-dot" style="background:${m.color}"></span>${m.name}</div>`).join('')}
        ${PERK_OPTIONS.map(p=>`<div class="legend-item"><span class="legend-dot" style="background:${p.color}"></span>${p.name}</div>`).join('')}
      </div>
      <div class="seatmap-plane">
        <svg class="seatmap-plane-art" viewBox="0 0 320 1600" preserveAspectRatio="none">
          <path d="M160,0 C195,45 212,105 214,165 L214,1450 C214,1500 190,1550 160,1600 C130,1550 106,1500 106,1450 L106,165 C108,105 125,45 160,0 Z" fill="#e3e3e0"/>
          <path d="M110,${wingY-90} L-90,${wingY+70} L-90,${wingY+130} L110,${wingY+30} Z" fill="#d3d3ce"/>
          <path d="M210,${wingY-90} L410,${wingY+70} L410,${wingY+130} L210,${wingY+30} Z" fill="#d3d3ce"/>
          <path d="M116,${tailY-30} L40,${tailY+15} L40,${tailY+30} L116,${tailY+5} Z" fill="#d3d3ce"/>
          <path d="M204,${tailY-30} L280,${tailY+15} L280,${tailY+30} L204,${tailY+5} Z" fill="#d3d3ce"/>
        </svg>
        <div class="seatmap-fuselage">
          <div class="seatmap-nose">
            <div class="cockpit-windows"><span></span><span></span></div>
          </div>
          ${rows.map(r=>{
            const isExit = ac.exitRows && ac.exitRows.includes(r);
            return `
            <div class="seat-row ${isExit?'exit-row':''}">
              ${isExit ? `<span class="exit-tag">«EXIT</span>` : ''}
              <div class="seat-row-num">${r}</div>
              <div class="seat-group">${['A','B','C'].map(col=>seatCellHTML(r,col)).join('')}</div>
              <div class="seat-aisle"></div>
              <div class="seat-group">${['D','E','F'].map(col=>seatCellHTML(r,col)).join('')}</div>
              ${isExit ? `<span class="exit-tag right">EXIT»</span>` : ''}
            </div>`;
          }).join('')}
        </div>
      </div>
    </div>
  </div>
  ${state.seatSelection.length>0 ? `
  <div class="seat-actionbar">
    <div class="seat-actionbar-count">${state.seatSelection.length} seat${state.seatSelection.length>1?'s':''} selected</div>
    <div style="display:flex;gap:8px;">
      <button class="action-btn secondary" id="seatClearSelBtn">Clear</button>
      <button class="action-btn" id="seatAssignBtn">Assign meal / remark</button>
    </div>
  </div>` : ''}
  ${state.seatMapPanelOpen ? mealPanelHTML() : ''}
  `;
}

function checkoutModal(){
    const total = grandTotal();
  const c = CURRENCIES[state.currency];
  const dec = isWholeUnit(state.currency)?0:2;
  const totalLocal = dec===0 ? Math.ceil(total * effectiveRate(state.currency)) : total * effectiveRate(state.currency);
  const given = parseFloat(state.cashGiven)||0;
  const change = given - totalLocal;
  const canConfirm = state.payMethod==='card' || given >= totalLocal;
  const quickAmounts = [totalLocal, Math.ceil(totalLocal/100)*100, Math.ceil(totalLocal/500)*500].filter((v,i,a)=>a.indexOf(v)===i && v>0);

  return `
  <div class="modal-overlay" id="overlay">
    <div class="modal-sheet" onclick="event.stopPropagation()">

          <div class="due-amount">${fmt(grandTotal())}</div>
        </div>
        ${state.payMethod==='cash' ? `

          <input type="text" inputmode="decimal" class="cash-input" id="cashInput" placeholder="0.00" value="${state.cashGiven}">
          <div class="quick-cash">
            ${quickAmounts.map(v=>`<button data-quick="${v.toFixed(dec)}">${c.symbol}${v.toFixed(dec)}</button>`).join('')}
          </div>
          ${given>0 ? `<div class="change-row"><span>Change due</span><span>${c.symbol}${Math.max(0,change).toFixed(dec)}</span></div>` : ''}
        ` : `
          <div class="card-note">
            💳 In a native build this hands off to a card reader (Tap to Pay on iPhone, or a Bluetooth/Lightning reader). Here it's simulated — tap Confirm to complete the sale.
          </div>
        `}
        <button class="confirm-btn" id="confirmSaleBtn" ${canConfirm?'':'disabled'}>Confirm Sale · ${fmt(grandTotal())}</button>
      </div>

  </div>`;
}

/* ---------------- Event wiring ---------------- */
function wireFocusInput(id, onInput){
  const el = document.getElementById(id);
  if(!el) return;
  el.oninput = e=>{ state._focusField = id; onInput(e.target.value); };
  if(state._focusField === id){ el.focus(); const p=el.value.length; try{ el.setSelectionRange(p,p);}catch(e){} }
}

let seatDragMode = 'select';
let seatDragLast = null;
function applySeatDrag(seatCode){
  const i = state.seatSelection.indexOf(seatCode);
  if(seatDragMode==='select' && i===-1) state.seatSelection.push(seatCode);
  if(seatDragMode==='deselect' && i!==-1) state.seatSelection.splice(i,1);
}
document.addEventListener('pointerdown', (e)=>{
  const seatEl = e.target.closest('[data-seat]');
  if(!seatEl) return;
  e.preventDefault();
  const seatCode = seatEl.dataset.seat;
  seatDragMode = state.seatSelection.includes(seatCode) ? 'deselect' : 'select';
  seatDragLast = seatCode;
  state.seatDragging = true;
  applySeatDrag(seatCode);
  render();
});
document.addEventListener('pointermove', (e)=>{
  if(!state.seatDragging) return;
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const seatEl = el && el.closest && el.closest('[data-seat]');
  if(!seatEl) return;
  const seatCode = seatEl.dataset.seat;
  if(seatCode===seatDragLast) return;
  seatDragLast = seatCode;
  applySeatDrag(seatCode);
  render();
});
document.addEventListener('pointerup', ()=>{ state.seatDragging = false; });

loadState();
applyTheme();
if(state.flightSetup && state.flightSetup.confirmed && state.flightSetup.syncStatus!=='synced'){
  setTimeout(()=> attemptFlightSync(), 300);
}
if(state.syncQueue && state.syncQueue.length>0){
  setTimeout(()=> flushSyncQueue(), 300);
}
render();
